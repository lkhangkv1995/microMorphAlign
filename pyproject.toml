[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micromorphalign"
version = "0.1.0"
description = "Bidirectional point-level refinement for globally registered multichannel tissue images"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MicroMorphAlign contributors"}]
keywords = ["image registration", "histology", "fluorescence", "point matching", "microscopy"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.7",
    "torch>=2.0",
    "scikit-image>=0.20",
    "tifffile>=2023.7",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipywidgets>=8", "nbformat>=5"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["micromorphalign*", "morphalign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

